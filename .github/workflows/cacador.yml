name: Caçador de clientes

on:
  schedule:
    # A cada 10 min (minutos 3, 13, 23...), das 7h às 23h (Brasília = UTC-3).
    # Evita o minuto 00, quando o GitHub fica sobrecarregado e pula agendamentos.
    - cron: "3-59/10 10-23,0-1 * * *"
  workflow_dispatch: # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: cacador
  cancel-in-progress: false

jobs:
  cacar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Procurar projetos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python cacador.py

      - name: Guardar projetos já vistos
        run: |
          git config user.name "cacador-bot"
          git config user.email "cacador-bot@users.noreply.github.com"
          git add vistos.json
          git diff --cached --quiet || (git commit -m "vistos" && git push)
