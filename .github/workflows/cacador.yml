name: Caçador de clientes

# Cada rodada fica vigiando por ~5h40 (a cada 10 min, das 7h às 23h de Brasília)
# e, ao terminar, liga a próxima rodada sozinha. O agendamento abaixo é só reserva,
# caso essa corrente se quebre (o agendamento do GitHub costuma atrasar ou pular).
on:
  schedule:
    - cron: "17 10,16,22 * * *"
  push:
    branches: [main]
    paths: ["cacador.py", "vigiar.sh", ".github/workflows/**"]
  workflow_dispatch: # botão "Run workflow" para ligar na hora

permissions:
  contents: write
  actions: write

# Só existe uma rodada por vez: a mais nova substitui a anterior.
concurrency:
  group: cacador
  cancel-in-progress: true

jobs:
  cacar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Vigiar projetos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ASSISTENTE_URL: ${{ secrets.ASSISTENTE_URL }}
        run: bash vigiar.sh

      - name: Ligar a próxima rodada
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cacador.yml --ref main
